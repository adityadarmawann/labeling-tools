<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Periksa anotasi{% endblock %}</title>
<link rel="stylesheet" href="{{ statik('app.css') }}">
<script>
/* Dipasang sebelum CSS sempat melukis. Tanpa ini, halaman berkedip terang
   sepersekian detik sebelum tema gelap terpasang — dan kedipan itu justru
   paling terasa di ruangan gelap, tempat tema gelap dipilih. */
(function () {
  try {
    var t = localStorage.getItem('labelapp_tema');
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  } catch (e) { /* mode privat */ }
})();
</script>
</head>
<body>
{% block body %}{% endblock %}
<div class="toast" id="t"></div>
<script src="{{ statik('app.js') }}"></script>
</body>
</html>

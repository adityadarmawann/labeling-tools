{% extends "base.html" %}
{% block title %}Masuk{% endblock %}
{% block body %}
<main>
  <form class="card-form" method="POST" action="/login">
    <h2>Periksa anotasi</h2>
    <p class="sub">Masuk dengan akun tim.</p>

    <label class="form-lbl" for="u">Nama akun</label>
    <input id="u" name="user" type="text" autocomplete="username" autofocus
           value="{{ akun }}">

    <label class="form-lbl" for="p">Password</label>
    <input id="p" name="pw" type="password" autocomplete="current-password">

    <button class="cta" type="submit">Masuk</button>
    {% if error %}<p class="bad">{{ error }}</p>{% endif %}
  </form>
  {% if boleh_daftar %}
  <p class="sub" style="margin-top:14px">Belum punya akun?
    <a href="/daftar">Daftar di sini</a>, lalu minta admin
    menyetujuinya.</p>
  {% endif %}
</main>
{% endblock %}

# HIGOLAB publik lewat IP TANPA domain, HTTPS dengan sertifikat self-signed.
# Akses: https://103.182.240.28  (peramban memperingatkan SEKALI per perangkat
# -> Advanced -> Proceed, karena cert bukan dari CA publik). Lalu lintas tetap
# terenkripsi; password tak lagi telanjang seperti http polos.
#
# Kenapa self-signed: sertifikat tepercaya (Let's Encrypt) butuh NAMA DOMAIN,
# tak terbit untuk IP telanjang. Kalau suatu saat mau "gembok hijau" tanpa
# peringatan dan tanpa beli, daftar subdomain gratis (mis. higolab.duckdns.org
# -> 103.182.240.28) lalu `certbot --nginx -d higolab.duckdns.org`.
#
# ---------------------------------------------------------------------------
# LANGKAH (butuh sudo -- kamu jalankan sendiri):
#
# 1) Buat sertifikat self-signed (berlaku 10 tahun, memuat IP sebagai SAN):
#      sudo mkdir -p /etc/nginx/ssl
#      sudo openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#        -keyout /etc/nginx/ssl/higolab-selfsigned.key \
#        -out    /etc/nginx/ssl/higolab-selfsigned.crt \
#        -subj "/CN=103.182.240.28" \
#        -addext "subjectAltName=IP:103.182.240.28"
#      sudo chmod 600 /etc/nginx/ssl/higolab-selfsigned.key
#
# 2) Pasang berkas ini (pakai PATH ABSOLUT ke worktree, bukan relatif):
#      sudo cp /home/paul/computer-vision/smartbin/rvm/labeling-tools-dev/deploy/nginx-higolab-ip-selfsigned.conf \
#              /etc/nginx/sites-available/higolab
#      sudo ln -s /etc/nginx/sites-available/higolab /etc/nginx/sites-enabled/
#      # Matikan site bawaan "default": ia juga listen 80 default_server dan
#      # akan bentrok ("duplicate default server"). Isinya cuma halaman Welcome.
#      sudo rm -f /etc/nginx/sites-enabled/default
#      sudo nginx -t && sudo systemctl reload nginx
#
# 3) Firewall ufw -- ADITIF saja:
#      sudo ufw allow 443/tcp
#      sudo ufw allow 80/tcp          # untuk pengalihan ke HTTPS
#      # JANGAN `ufw allow 8042`: biar 8042 tetap tertutup dari publik,
#      # hanya nginx di 127.0.0.1 yang menjangkaunya.
#
# 4) env/prod.env (perkuat backend), lalu ./deploy.sh --dari-dev:
#      LABELAPP_HOST=127.0.0.1           # app tak nongol di antarmuka publik
#      LABELAPP_DAFTAR_HANYA_UNDANGAN=1  # pendaftaran hanya lewat undangan
#    Cookie Secure + rate-limit publik menyala otomatis lewat X-Forwarded-Proto.
#
# 5) Uji:
#      https://103.182.240.28/login  -> terima peringatan sekali, lalu form masuk
#      dari luar: http://103.182.240.28:8042  -> HARUS tak terjangkau (ufw)
# ---------------------------------------------------------------------------

# Port 80 -> paksa HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    # Bentuk `listen ... ssl http2` dipakai supaya cocok juga dengan nginx lama
    # (mis. 1.18 di Ubuntu). Direktif terpisah `http2 on;` baru ada di 1.25+.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 103.182.240.28;

    ssl_certificate     /etc/nginx/ssl/higolab-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/higolab-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Unggahan dataset bisa sangat besar (ekspor Roboflow .zip s/d ~4 GB,
    # video s/d 2 GB): longgarkan supaya penolakan datang dari aplikasi dengan
    # pesan jelas, bukan 413 telanjang dari nginx.
    client_max_body_size 4100m;
    proxy_request_buffering off;

    # SAM / pembuatan versi / latih bisa lama; timeout bawaan 60 dtk kependekan.
    proxy_connect_timeout 15s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    location / {
        proxy_pass http://127.0.0.1:8042;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Header di atas yang membuat aplikasi tahu ini lewat proxy HTTPS:
        # dari sini cookie Secure, HSTS, dan rate-limit login publik menyala,
        # dan tombol desktop (AnyLabeling/dialog folder) tetap mati bagi
        # akses jaringan. Jangan dihapus.
    }
}

# HIGOLAB publik lewat IP TANPA domain, HTTPS self-signed, di PORT KHUSUS 8042.
# Akses: https://103.182.240.28:8042  (peramban memperingatkan SEKALI per
# perangkat -> Advanced -> Proceed, karena cert bukan dari CA publik). Lalu
# lintas tetap terenkripsi; password tak lagi telanjang seperti http polos.
#
# Kenapa port 8042: server ini menjalankan banyak aplikasi yang dibedakan PER
# PORT (8042 HIGOLAB, 8043 dev, 8001/8173 app lain, dst). nginx HANYA memegang
# 8042 untuk HIGOLAB; port lain tak tersentuh. nginx tidak memakai 80/443.
#
# Arsitektur: nginx (TLS) di 8042  ->  proxy ke app di 127.0.0.1:8142 (loopback,
# tak publik). Port internal 8142 sengaja beda dari 8042 supaya nginx dan app
# tak berebut port yang sama; 8142 hanya loopback, tak pernah dibuka ufw.
#
# ---------------------------------------------------------------------------
# LANGKAH (butuh sudo -- kamu jalankan sendiri):
#
# 1) Sertifikat self-signed (SUDAH dibuat sebelumnya; kalau belum):
#      sudo mkdir -p /etc/nginx/ssl
#      sudo openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#        -keyout /etc/nginx/ssl/higolab-selfsigned.key \
#        -out    /etc/nginx/ssl/higolab-selfsigned.crt \
#        -subj "/CN=103.182.240.28" -addext "subjectAltName=IP:103.182.240.28"
#      sudo chmod 600 /etc/nginx/ssl/higolab-selfsigned.key
#
# 2) Pasang berkas ini (path ABSOLUT ke worktree):
#      sudo cp /home/paul/computer-vision/smartbin/rvm/labeling-tools-dev/deploy/nginx-higolab-ip-selfsigned.conf \
#              /etc/nginx/sites-available/higolab
#      # symlink sites-enabled/higolab biasanya sudah ada; kalau belum:
#      sudo ln -sf /etc/nginx/sites-available/higolab /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#
# 3) Firewall ufw: buka 8042 ke publik, BATALKAN 80/443 yang tak jadi dipakai:
#      sudo ufw allow 8042/tcp
#      sudo ufw delete allow 80/tcp     # kalau tadi sempat dibuka
#      sudo ufw delete allow 443/tcp    # kalau tadi sempat dibuka
#    (Port lain, mis. 8043/8001/8173, tak disentuh.)
#
# 4) env/prod.env SUDAH disetel: PORT=8142 (app internal), HOST=127.0.0.1,
#    DAFTAR_HANYA_UNDANGAN=1. Jalankan deploy supaya prod hidup di 8142 dengan
#    kode terbaru:
#      cd /home/paul/computer-vision/smartbin/rvm/labeling-tools-dev
#      ./deploy.sh --dari-dev
#
# 5) Uji:
#      https://103.182.240.28:8042/login  -> terima peringatan sekali, lalu masuk
#      curl -skI https://127.0.0.1:8042/login -> ada Strict-Transport-Security,
#                                                X-Content-Type-Options: nosniff
# ---------------------------------------------------------------------------

server {
    # TLS di PORT 8042 (bentuk `listen ... ssl http2` supaya cocok nginx 1.18).
    listen 8042 ssl http2;
    listen [::]:8042 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/higolab-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/higolab-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Kalau ada yang tak sengaja membuka http:// (bukan https://) di port ini,
    # nginx memunculkan 497 "The plain HTTP request was sent to HTTPS port".
    # Dialihkan otomatis ke https di port yang sama supaya tak membingungkan.
    error_page 497 =301 https://$host:8042$request_uri;

    # Unggahan dataset bisa sangat besar (ekspor Roboflow .zip s/d ~4 GB, video
    # s/d 2 GB): longgarkan supaya penolakan datang dari aplikasi dengan pesan
    # jelas, bukan 413 telanjang dari nginx.
    client_max_body_size 4100m;
    proxy_request_buffering off;

    # SAM / pembuatan versi / latih bisa lama; timeout bawaan 60 dtk kependekan.
    proxy_connect_timeout 15s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    location / {
        proxy_pass http://127.0.0.1:8142;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Header di atas yang membuat aplikasi tahu ini lewat proxy HTTPS:
        # dari sini cookie Secure, HSTS, dan rate-limit login publik menyala
        # (deps.lewat_https / X-Forwarded-For), dan tombol desktop tetap mati
        # bagi akses jaringan. Jangan dihapus.
    }
}

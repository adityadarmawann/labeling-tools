# HIGOLAB di PORT 8042 -> kini CUMA PENGALIH ke https://annotate.higo.id.
#
# Dulu 8042 menyajikan HIGOLAB langsung lewat IP (https://103.182.240.28:8042,
# cert self-signed). Sekarang domain resmi annotate.higo.id (cert Let's Encrypt)
# sudah jalan, jadi 8042 TIDAK lagi mem-proxy app -- ia memberi 301 permanen ke
# https://annotate.higo.id$request_uri. Siapa pun yang masih membuka IP:8042
# (bookmark lama) otomatis mendarat di domain, path + query dipertahankan.
#
# KENAPA SSL di 8042 DIPERTAHANKAN (bukan dihapus): bookmark lama berupa
# https://, dan sebagian peramban sudah meng-HSTS-kan host:port itu. Supaya
# handshake-nya tetap sukses lalu dialihkan (bukan gagal TLS), cert self-signed
# tetap dipasang. Peramban yang sudah pernah menerima cert itu tak ditanya lagi;
# yang baru: terima peringatan SEKALI -> Proceed -> langsung dialihkan ke domain.
#
# App HIGOLAB sendiri tetap hidup di 127.0.0.1:8142 (loopback) dan dilayani
# publik HANYA lewat vhost annotate.higo.id (443). Port 8042 tak menyentuhnya.
#
# ---------------------------------------------------------------------------
# PASANG (butuh sudo -- kamu jalankan sendiri; Claude tak menyentuh nginx/ufw):
#
#   sudo cp /home/paul/computer-vision/smartbin/rvm/labeling-tools-dev/deploy/nginx-higolab-ip-selfsigned.conf \
#           /etc/nginx/sites-available/higolab
#   sudo nginx -t && sudo systemctl reload nginx
#
#   # (symlink sites-enabled/higolab sudah ada; ufw 8042 sudah terbuka -- tak berubah.)
#
# UJI:
#   curl -skI https://127.0.0.1:8042/login
#       -> HTTP/1.1 301 ... Location: https://annotate.higo.id/login
#   buka https://103.182.240.28:8042/  di peramban -> pindah ke annotate.higo.id
# ---------------------------------------------------------------------------

server {
    # TLS di PORT 8042 (bentuk `listen ... ssl http2` supaya cocok nginx 1.18).
    listen 8042 ssl http2;
    listen [::]:8042 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/higolab-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/higolab-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Kalau ada yang membuka http:// (bukan https://) di port ini, nginx
    # memunculkan 497. Ikut dialihkan ke DOMAIN (bukan ke IP:8042 lagi).
    error_page 497 =301 https://annotate.higo.id$request_uri;

    # Satu-satunya tugas 8042 sekarang: alihkan SEMUA ke domain, permanen.
    # Pengalihan dijawab sebelum bodi dibaca, jadi batas unggah tak relevan.
    location / {
        return 301 https://annotate.higo.id$request_uri;
    }
}

# Reverse proxy + HTTPS untuk HIGOLAB di higolab.higo.id
# Server: paul-higo (103.182.240.28). HIGOLAB prod jalan di 127.0.0.1:8042.
#
# PENTING soal higo.id: higo.id (apex) jalan di MESIN LAIN (103.141.230.130),
# bukan di server ini. Yang kita lakukan di sini TAK menyentuhnya. Satu-satunya
# singgungan adalah menambah SATU record DNS baru di zona higo.id:
#     higolab.higo.id.  A  103.182.240.28
# Itu MENAMBAH subdomain, tidak mengubah/menghapus record apex atau lainnya.
# Verifikasi sesudahnya: `dig higo.id` HARUS tetap 103.141.230.130 (utuh),
# `dig higolab.higo.id` jadi 103.182.240.28.
#
# ---------------------------------------------------------------------------
# LANGKAH PASANG (butuh sudo -- jalankan sendiri; Claude tidak menyentuh
# firewall/sudo). Jalankan SETELAH record DNS di atas menyebar.
#
# 0) Pastikan HIGOLAB prod hidup di 8042 dan 80/443 masih bebas:
#      curl -sS http://127.0.0.1:8042/login | head
#      sudo ss -ltnp | grep -E ':80 |:443 '        # harus kosong
#
# 1) Pasang nginx + certbot (sekali saja; tidak mengganggu app lain di port tinggi):
#      sudo apt update && sudo apt install -y nginx python3-certbot-nginx
#
# 2) Pasang berkas ini sebagai satu site (vhost berbasis NAMA -- berbagi 443
#    tanpa menutup domain lain):
#      sudo cp deploy/nginx-higolab.higo.id.conf \
#              /etc/nginx/sites-available/higolab.higo.id
#      sudo ln -s /etc/nginx/sites-available/higolab.higo.id \
#                 /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#
# 3) Terbitkan sertifikat HANYA untuk subdomain ini (tak menyentuh cert lain):
#      sudo certbot --nginx -d higolab.higo.id
#    certbot menambah blok 443 + pengalihan HTTP->HTTPS ke berkas ini sendiri.
#
# 4) Firewall ufw -- ADITIF saja, jangan ubah default/aturan lain:
#      sudo ufw allow 80/tcp
#      sudo ufw allow 443/tcp
#      # Port 8042 TETAP tertutup dari publik (hanya nginx di 127.0.0.1 yang
#      # menjangkaunya). Jangan `ufw allow 8042`.
#
# 5) Perkuat backend (opsional tapi dianjurkan): di env/prod.env set
#      LABELAPP_HOST=127.0.0.1          # backend tak nongol di antarmuka publik
#      LABELAPP_DAFTAR_HANYA_UNDANGAN=1 # pendaftaran hanya lewat undangan
#    lalu redeploy (./deploy.sh --dari-dev). Cookie Secure + HSTS menyala
#    otomatis begitu diakses lewat HTTPS (lihat app: deps.lewat_https).
#
# 6) Uji:
#      https://higolab.higo.id/login  -> form masuk, gembok hijau
#      curl -I https://higolab.higo.id/login  -> ada Strict-Transport-Security,
#                                                X-Content-Type-Options: nosniff
#      dari luar: http://103.182.240.28:8042/  -> HARUS tak terjangkau (ufw)
# ---------------------------------------------------------------------------
#
# Berkas ini bentuk SEBELUM certbot: hanya port 80. certbot yang menambah TLS.

server {
    listen 80;
    listen [::]:80;
    server_name higolab.higo.id;

    # Unggahan dataset bisa SANGAT besar: ekspor Roboflow (.zip) sampai
    # LABELAPP_MAX_ZIP_MB (bawaan 4096 MB) dan video sampai MAX_VIDEO_MB
    # (2048 MB). Dibuat sedikit di atasnya supaya penolakan datang dari
    # APLIKASI dengan pesan jelas, bukan 413 telanjang dari nginx. Turunkan
    # kalau impor raksasa tak diperlukan dari publik.
    client_max_body_size 4100m;

    # Unggahan dikirim per berkas lewat PUT bodi mentah: jangan ditampung dulu
    # di nginx, teruskan mengalir supaya memori tak menumpuk dan progres di
    # peramban tetap jujur.
    proxy_request_buffering off;

    # SAM bisa makan beberapa detik untuk gambar pertama (encoder jalan);
    # pembuatan versi/latih lebih lama lagi. Timeout bawaan 60 dtk kependekan.
    proxy_connect_timeout 15s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    location / {
        proxy_pass http://127.0.0.1:8042;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Header di atas yang membuat aplikasi tahu permintaan datang lewat
        # proxy: dari sinilah cookie Secure, HSTS, dan rate-limit login publik
        # menyala (deps.lewat_https / X-Forwarded-For), dan tombol desktop
        # (AnyLabeling, dialog folder) tetap mati bagi akses jaringan. Jangan
        # dihapus.
    }
}

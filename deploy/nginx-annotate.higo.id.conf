# Reverse proxy + HTTPS untuk HIGOLAB di annotate.higo.id
# Server: paul-higo (103.182.240.28). App HIGOLAB prod jalan di 127.0.0.1:8142
# (loopback). nginx vhost ini terminasi TLS di 443 lalu proxy ke app itu.
#
# PENTING soal higo.id: apex higo.id jalan di MESIN LAIN (103.141.230.130),
# bukan server ini. Yang dilakukan di sini TAK menyentuhnya. Satu-satunya
# singgungan: menambah SATU record DNS di zona higo.id (dilakukan pemilik higo.id):
#     annotate.higo.id.  A  103.182.240.28
# Itu MENAMBAH subdomain, tak mengubah/menghapus apex atau record lain.
# Verifikasi: `dig +short higo.id` HARUS tetap 103.141.230.130 (utuh),
#             `dig +short annotate.higo.id` jadi 103.182.240.28.
#
# Catatan: akses lama lewat IP (https://103.182.240.28:8042, self-signed) TETAP
# jalan berdampingan -- vhost ini entri BARU di 443, tak menyentuh site 8042.
# ---------------------------------------------------------------------------
# LANGKAH PASANG (butuh sudo -- jalankan sendiri; Claude tak menyentuh
# nginx/certbot/ufw/DNS). Jalankan SETELAH record DNS di atas menyebar
# (cek: `dig +short annotate.higo.id` -> 103.182.240.28).
#
# 0) Pastikan app prod hidup di 8142 dan 80/443 masih bebas:
#      curl -sS http://127.0.0.1:8142/login | head
#      sudo ss -ltnp | grep -E ':80 |:443 '          # harus KOSONG
#
# 1) Pasang nginx + certbot (sekali saja; app port-tinggi lain tak terganggu):
#      sudo apt update && sudo apt install -y nginx python3-certbot-nginx
#
# 2) Pasang berkas ini sebagai satu site (vhost berbasis NAMA -> berbagi 443
#    tanpa menutup domain lain):
#      sudo cp /home/paul/computer-vision/smartbin/rvm/labeling-tools/deploy/nginx-annotate.higo.id.conf \
#              /etc/nginx/sites-available/annotate.higo.id
#      sudo ln -s /etc/nginx/sites-available/annotate.higo.id /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#
# 3) Terbitkan sertifikat Let's Encrypt HANYA untuk subdomain ini:
#      sudo certbot --nginx -d annotate.higo.id
#    certbot menambah blok 443 + pengalihan HTTP->HTTPS ke berkas INI sendiri,
#    dan memperbarui sertifikatnya otomatis. Cert lain tak tersentuh.
#
# 4) Firewall ufw -- ADITIF saja, jangan ubah default/aturan lain:
#      sudo ufw allow 80/tcp
#      sudo ufw allow 443/tcp
#    Port 8142 TETAP loopback (jangan `ufw allow 8142`). 8042 lama boleh tetap
#    terbuka (akses IP) atau ditutup nanti kalau domain sudah cukup.
#
# 5) Backend tahu alamat publiknya (QR "unggah dari HP" + tautan undangan):
#    di env/prod.env set
#      LABELAPP_BASIS_PUBLIK=https://annotate.higo.id
#    (LABELAPP_HOST=127.0.0.1 dan DAFTAR_HANYA_UNDANGAN=1 sudah ada), lalu:
#      cd /home/paul/computer-vision/smartbin/rvm/labeling-tools-dev && ./deploy.sh --dari-dev
#    Cookie Secure + HSTS menyala otomatis begitu diakses lewat HTTPS
#    (header X-Forwarded-Proto di bawah -> deps.lewat_https).
#
# 6) Uji:
#      https://annotate.higo.id/login     -> form masuk, gembok hijau (cert sah)
#      curl -I https://annotate.higo.id/login
#          -> ada Strict-Transport-Security, X-Content-Type-Options: nosniff
#      dari LUAR: http://103.182.240.28:8142/  -> HARUS tak terjangkau (loopback)
# ---------------------------------------------------------------------------
#
# Berkas ini bentuk SEBELUM certbot: hanya port 80. certbot yang menambah TLS.

server {
    listen 80;
    listen [::]:80;
    server_name annotate.higo.id;

    # Unggahan dataset bisa SANGAT besar: ekspor Roboflow (.zip) sampai
    # LABELAPP_MAX_ZIP_MB (bawaan 4096 MB) dan video sampai MAX_VIDEO_MB.
    # Dibuat sedikit di atasnya supaya penolakan datang dari APLIKASI dengan
    # pesan jelas, bukan 413 telanjang dari nginx.
    client_max_body_size 4100m;

    # Unggahan dikirim per berkas lewat PUT bodi mentah: jangan ditampung dulu
    # di nginx, teruskan mengalir supaya memori tak menumpuk dan progres di
    # peramban tetap jujur.
    proxy_request_buffering off;

    # SAM beberapa detik untuk gambar pertama; pembuatan versi/latih lebih lama.
    # Timeout bawaan 60 dtk kependekan.
    proxy_connect_timeout 15s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    location / {
        # Proxy ke APP langsung (127.0.0.1:8142), bukan ke site 8042. TLS
        # diterminasi di sini (443, cert Let's Encrypt), lalu http polos ke
        # loopback app.
        proxy_pass http://127.0.0.1:8142;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Header di atas yang membuat app tahu permintaan lewat proxy HTTPS:
        # dari sinilah cookie Secure, HSTS, dan rate-limit login publik menyala
        # (deps.lewat_https / X-Forwarded-For), dan tombol desktop tetap mati
        # bagi akses jaringan. Jangan dihapus.
    }
}

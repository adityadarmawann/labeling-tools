# Reverse proxy untuk labeling-tools di anylabel.higo.id
#
# Pasang di paul-higo (butuh sudo — jalankan sendiri, lihat deploy/README.md):
#   sudo cp nginx-anylabel.higo.id.conf /etc/nginx/sites-available/anylabel.higo.id
#   sudo ln -s /etc/nginx/sites-available/anylabel.higo.id /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Berkas ini bentuk SEBELUM certbot dijalankan: hanya port 80, tanpa TLS.
# `certbot --nginx -d anylabel.higo.id` akan menambahkan blok 443 dan
# pengalihan HTTP->HTTPS sendiri ke berkas ini.

server {
    listen 80;
    listen [::]:80;
    server_name anylabel.higo.id;

    # Unggahan gambar bisa besar. Aplikasi membatasi 80 MB per berkas
    # (LABELAPP_MAX_UPLOAD_MB); angka di sini dibuat sedikit lebih longgar
    # supaya penolakan datang dari aplikasi dengan pesan yang jelas, bukan
    # dari nginx dengan 413 tanpa keterangan.
    client_max_body_size 100M;

    # Unggahan dikirim per berkas lewat PUT dengan bodi mentah. Jangan
    # ditampung dulu di nginx — teruskan mengalir supaya memori tidak menumpuk
    # dan progres di browser tetap jujur.
    proxy_request_buffering off;

    # SAM bisa memakan beberapa detik untuk gambar pertama (encoder jalan).
    # Timeout bawaan 60 detik terlalu pendek kalau gambarnya besar.
    proxy_connect_timeout 15s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location / {
        proxy_pass http://127.0.0.1:8042;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Kehadiran header di atas yang membuat aplikasi tahu permintaan datang
        # lewat proxy, sehingga tombol yang membuka jendela di layar server
        # (AnyLabeling, dialog folder) tetap mati. Jangan dihapus.
    }
}
